[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbricks"
dynamic = ["version"]
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "licenses/**/*.txt"]
requires-python = ">=3.12"

dependencies = [
    "newton==1.6.0",
    "warp-lang>=1.17.0",
    "pyglet==2.1.13",
    "numpy==2.4.3",
    "trimesh>=4.6.8",
    "imgui-bundle==1.92.4",
    "pillow>=13.0.0",
    "usd-core==26.3",
    "scipy==1.17.1",
    "tensorrt-cu12==10.8.0.43; sys_platform != 'darwin'",
    "tensorrt-cu12-bindings==10.8.0.43; sys_platform != 'darwin'",
    "tensorrt-cu12-libs==10.8.0.43; sys_platform != 'darwin'",
    "onnxruntime>=1.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
metal = [
    "torch==2.14.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "safetensors==0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["motionbricks*", "tools.onnx", "tools.onnx.models*"]
exclude = ["app*", "assets*"]

[tool.setuptools.package-data]
motionbricks = ["assets/**/*"]
"tools.onnx" = ["assets/*.npz"]

[tool.setuptools.dynamic]
version = { attr = "motionbricks.__version__" }

[tool.uv]
managed = true

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12"
version = "10.8.0.43"
requires-dist = ["tensorrt-cu12-bindings==10.8.0.43", "tensorrt-cu12-libs==10.8.0.43"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu12-libs"
version = "10.8.0.43"
requires-dist = ["nvidia-cuda-runtime-cu12"]
