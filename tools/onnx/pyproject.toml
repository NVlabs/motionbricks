[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbricks-onnx"
dynamic = ["version"]
description = "Export MotionBricks checkpoints to batched ONNX models"
license = "Apache-2.0"
license-files = ["licenses/**/*.txt"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "onnx==1.23.2",
    "safetensors==0.8.0",
    "torch==2.14.0+cpu; sys_platform != 'darwin'",
    "torch==2.14.0; sys_platform == 'darwin'",
]

[project.scripts]
motionbricks-onnx = "motionbricks_onnx.export:main"

[tool.setuptools]
package-dir = { motionbricks_onnx = "." }
include-package-data = false

[tool.setuptools.package-data]
motionbricks_onnx = ["assets/**/*"]

[tool.setuptools.dynamic]
version = { attr = "motionbricks_onnx.__version__" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.uv]
managed = true
